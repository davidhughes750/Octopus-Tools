[project]
name = "octopus-energy-downloader"
version = "1.0.0"
description = "Download electricity and gas usage data from Octopus Energy to CSV"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "python-dateutil>=2.8.2",
]

[project.scripts]
octopus-download = "octopus_downloader:main"
